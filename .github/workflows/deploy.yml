name: Build and deploy TOKI SATSUEI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Verify each pull-request merge snapshot independently so stale PR revisions
  # cannot block validation of the latest revision. Main pushes remain ordered.
  group: ${{ github.event_name == 'pull_request' && format('toki-satsuei-pr-check-{0}', github.sha) || (contains(github.event.head_commit.message || '', '[priority-validation]') && format('toki-satsuei-priority-{0}', github.sha)) || format('toki-satsuei-pages-queue-v2-{0}', github.ref) }}
  # Preserve active runs and queue rapid main-branch pushes without cancelling them.
  queue: max
  cancel-in-progress: false

jobs:
  freshness:
    name: Skip stale queued snapshots
    runs-on: ubuntu-24.04
    outputs:
      is_current: ${{ steps.check.outputs.is_current }}
    steps:
      - name: Check whether this push is still the main branch head
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale queued commit $GITHUB_SHA; main is $current_sha."
          fi

  verify-and-package:
    needs: freshness
    if: needs.freshness.outputs.is_current == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'

      - name: Set up Node.js for axe-core and Lighthouse
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned accessibility and performance audit tools
        run: npm install --no-save --no-package-lock axe-core@4.14.1 @lhci/cli@0.16.1

      - name: Generate page-scoped CSS bundles from source
        run: python scripts/build-css.py

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install --upgrade pip-audit
          python -m playwright install --with-deps chromium webkit

      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r requirements-test.txt

      - name: Verify JavaScript syntax
        run: |
          node --check motion-system.js
          node --check site.js
          node --check availability.js
          node --check library.js
          node --check admin.js
          node --check client-gallery.js
          node --check worker.mjs

      - name: Verify Worker response headers and cache policy
        run: node tests/toki-worker-runtime-qa.mjs

      - name: Verify Python test and build syntax
        run: python -m compileall -q scripts tests

      - name: Audit secrets and personal data in public source
        run: python tests/toki-security-static-qa.py

      - name: Test deterministic cache fingerprint generation
        run: python scripts/fingerprint_assets.py --self-test

      - name: Verify TOKI API security limits and retry contracts
        run: python tests/toki-api-contract-qa.py

      - name: Scan full Git history and working tree with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          set +e
          gitleaks git --redact --verbose --report-format json --report-path /tmp/gitleaks-report.json --exit-code 1 .
          scan_status=$?
          set -e
          if [[ -s /tmp/gitleaks-report.json ]]; then
            cat /tmp/gitleaks-report.json
          fi
          exit "$scan_status"

      - name: Build media archive manifest
        run: python scripts/build-toki-media-library.py

      - name: Verify page and asset integration
        run: python tests/toki-asset-integration-qa.py
      - name: Verify self-hosted photography and fonts
        run: python tests/toki-self-hosted-media-qa.py
      - name: Export generated CSS bundles for cascade diagnostics
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("css_builder", "scripts/build-css.py")
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)
          output = Path("/tmp/css-build-diagnostics")
          output.mkdir(parents=True, exist_ok=True)
          for name in builder.BUNDLES:
              (output / name).write_text(builder.build(name), encoding="utf-8")
          PY

      - name: Upload generated CSS diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: css-build-diagnostics
          path: /tmp/css-build-diagnostics/
          retention-days: 1

      - name: Verify allowlisted Pages and Workers static outputs
        run: python tests/toki-worker-static-build-qa.py

      - name: Verify responsive layouts
        run: python tests/toki-layout-browser-qa.py
      - name: Run orientation QA
        run: python tests/toki-orientation-qa.py

      - name: Verify CSS bundles are current
        run: python tests/toki-css-bundle-qa.py

      - name: Verify adaptive interactions
        run: python tests/toki-adaptive-interaction-qa.py

      - name: Verify 2D equipment angles, Sketchfab 3D viewer, and responsive layout
        run: python tests/toki-equipment-qa.py

      - name: Verify scroll-linked motion and parallax
        run: python tests/toki-scroll-motion-qa.py

      - name: Verify experience design and booking usability
        run: python tests/toki-experience-design-qa.py


      - name: Verify public pages and search discovery
        run: python tests/toki-public-pages-qa.py

      - name: Verify Supabase-backed booking form and request flow
        run: python tests/toki-booking-browser-qa.py

      - name: Verify pricing calculator logic and package add-ons
        run: python tests/toki-pricing-calculator-qa.py

      - name: Verify owner administration dashboard
        run: python tests/toki-admin-dashboard-qa.py

      - name: Verify client gallery delivery and photo selection
        run: python tests/toki-client-gallery-qa.py

      - name: Verify public monthly booking availability calendar
        run: python tests/toki-availability-calendar-qa.py

      - name: Verify private Gmail notification relay source
        run: python tests/toki-email-notification-qa.py

      - name: Verify cinematic field-journal design
        run: python tests/toki-cinematic-design-qa.py

      - name: Test live TOKI HTTP security boundaries
        env:
          TOKI_EXPECT_TURNSTILE: ${{ vars.TOKI_EXPECT_TURNSTILE || '1' }}
        run: python tests/toki-live-http-security-qa.py


      - name: Assemble standalone Pages artifact
        run: |
          python scripts/build_static_site.py --target pages
          python scripts/fingerprint_assets.py dist

      - name: Verify generated asset fingerprints before publishing
        run: python scripts/fingerprint_assets.py dist --verify-only

      - name: Run axe-core WCAG 2.2 AA checks across all seven pages
        run: python tests/toki-axe-accessibility-qa.py

      - name: Test mobile WebKit, Android Chrome emulation, and rendered images
        run: python tests/toki-mobile-browser-image-qa.py

      - name: Expose Playwright Chromium binary to Lighthouse
        shell: bash
        run: |
          browser_path="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          echo "CHROME_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Run Lighthouse mobile audits across all seven packaged pages
        run: ./node_modules/.bin/lhci autorun

      - name: Upload Lighthouse and axe accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toki-accessibility-performance-reports
          path: |
            lighthouseci-reports/
            axe-accessibility-report.json
          if-no-files-found: ignore
          retention-days: 7


      - name: Upload verified static site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: toki-pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [freshness, verify-and-package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.freshness.outputs.is_current == 'true'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the verified commit for deployment verification
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Download verified static site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: toki-pages-dist
          path: dist

      - name: Set up Python for the live response verifier
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'

      - name: Recheck main-branch freshness before production deployment
        id: production_freshness
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment for $GITHUB_SHA; main is $current_sha."
          fi

      - name: Ensure the Cloudflare Pages project exists
        if: steps.production_freshness.outputs.is_current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add the CLOUDFLARE_API_TOKEN repository secret with Pages Write permission}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add the CLOUDFLARE_ACCOUNT_ID repository secret}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          body="/tmp/toki-pages-project.json"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/toki-satsuei")"
          if [[ "$status" == "404" ]]; then
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"name":"toki-satsuei","production_branch":"main"}' \
              "$api")"
            if [[ "$status" != "200" && "$status" != "201" ]]; then
              echo "::error::Cloudflare Pages project creation failed (HTTP $status). Check the token's Pages Write permission."
              cat "$body"
              exit 1
            fi
          elif [[ "$status" != "200" ]]; then
            echo "::error::Cloudflare Pages project lookup failed (HTTP $status). Check the account ID and Pages Write token."
            cat "$body"
            exit 1
          fi
          jq -e '.success == true and .result.name == "toki-satsuei"' "$body" >/dev/null

      - name: Deploy verified static output to Cloudflare Pages
        if: steps.production_freshness.outputs.is_current == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: pages deploy dist --project-name=toki-satsuei --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live TOKI security headers and fingerprinted resources
        if: steps.production_freshness.outputs.is_current == 'true'
        env:
          TOKI_SITE_URL: ${{ vars.TOKI_SITE_URL || 'https://toki-satsuei.pages.dev/' }}
          TOKI_REQUIRE_SECURITY_HEADERS: '1'
        run: python tests/toki-live-site-security-qa.py
