name: Import original TOKI brand and equipment assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-brand-equipment-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toki-original-asset-import
  cancel-in-progress: false

jobs:
  import-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1

      - name: Retrieve submitted original PNG assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/equipment/camera assets/brand
          curl --fail --silent --show-error --location \
            "https://media.base44.com/images/public/6af6b70d3bc15f40b706af32/7871079ba26be423af09db6104d8f2d1ff37142e8628e5237e3c5903e6dd0afc_263913.png" \
            --output assets/equipment/camera/EOS-3000D-front.png
          curl --fail --silent --show-error --location \
            "https://media.base44.com/images/public/6af6b70d3bc15f40b706af32/43802ff230f3fb82442d0fb16f8f5781ce0e408bf9045c35dd6d86864e18c722_263919.png" \
            --output assets/equipment/camera/EOS-3000D-left-side.png
          curl --fail --silent --show-error --location \
            "https://media.base44.com/images/public/6af6b70d3bc15f40b706af32/e5a9966b93dbbcbc4d87bd2f51e01c5bda5220d9aa88dd54c14f31b20c41a7f8_263925.png" \
            --output assets/equipment/camera/EOS-3000D-top.png
          curl --fail --silent --show-error --location \
            "https://media.base44.com/images/public/6af6b70d3bc15f40b706af32/584dd4df37044509d43d006a5d43bc16907074ce7ff3bd1747b0bee25e246437_263922.png" \
            --output assets/equipment/camera/EOS-3000D-right-side.png
          curl --fail --silent --show-error --location \
            "https://media.base44.com/images/public/6af6b70d3bc15f40b706af32/d2f1b5deaeaec0a78532665e7b51ff855cd44aba6b9aaafe4f65df042ab8b0ec_263916.png" \
            --output assets/equipment/camera/EOS-3000D-pop-up-flash.png
          curl --fail --silent --show-error --location \
            "https://media.base44.com/images/public/6af6b70d3bc15f40b706af32/0dc7421ca9cb7542ca2b28a3cb907168219d41cb7de843f70fd1de3221ee3a06_Toki_Satsuei_Brushstroke_Emblem.png" \
            --output assets/brand/Toki-Satsuei-Brushstroke-Emblem.png

      - name: Verify every downloaded file is byte-identical to its submitted original
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/toki-original-assets.sha256 <<'EOF'
          7871079ba26be423af09db6104d8f2d1ff37142e8628e5237e3c5903e6dd0afc  assets/equipment/camera/EOS-3000D-front.png
          43802ff230f3fb82442d0fb16f8f5781ce0e408bf9045c35dd6d86864e18c722  assets/equipment/camera/EOS-3000D-left-side.png
          e5a9966b93dbbcbc4d87bd2f51e01c5bda5220d9aa88dd54c14f31b20c41a7f8  assets/equipment/camera/EOS-3000D-top.png
          584dd4df37044509d43d006a5d43bc16907074ce7ff3bd1747b0bee25e246437  assets/equipment/camera/EOS-3000D-right-side.png
          d2f1b5deaeaec0a78532665e7b51ff855cd44aba6b9aaafe4f65df042ab8b0ec  assets/equipment/camera/EOS-3000D-pop-up-flash.png
          0dc7421ca9cb7542ca2b28a3cb907168219d41cb7de843f70fd1de3221ee3a06  assets/brand/Toki-Satsuei-Brushstroke-Emblem.png
          EOF
          sha256sum --check /tmp/toki-original-assets.sha256
          file assets/equipment/camera/*.png assets/brand/*.png

      - name: Commit originals to the dedicated asset folders
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/equipment/camera assets/brand
          if git diff --cached --quiet; then
            echo "Original asset files are already current."
            exit 0
          fi
          git commit -m "Add submitted TOKI camera and brand originals"
          git push origin HEAD:main
