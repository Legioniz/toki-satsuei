name: Import TOKI self-hosted visual assets

on:
  push:
    branches: [main]
    paths:
      - scripts/import_site_media.py
      - .github/workflows/import-toki-assets.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: toki-self-hosted-asset-import
  cancel-in-progress: false

jobs:
  import-assets:
    name: Preserve masters and build local variants
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'

      - name: Install pinned image tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==13.0.0

      - name: Import approved photography and font files
        run: python scripts/import_site_media.py

      - name: Verify originals, dimensions, responsive variants, fonts, and licenses
        run: python scripts/import_site_media.py --verify-only

      - name: Rebuild page-scoped CSS bundles with self-hosted fonts
        run: python scripts/build-css.py

      - name: Commit imported assets to the repository
        id: commit_import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photography assets/fonts toki-*.css
          if git diff --cached --quiet; then
            echo "Self-hosted assets are already up to date."
            echo "assets_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Import self-hosted photography and font assets"
          git push origin HEAD:main
          echo "assets_changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch production deployment after asset commit
        if: steps.commit_import.outputs.assets_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/dispatch-pages-deploy.sh
